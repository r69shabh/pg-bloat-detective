[project]
name = "pg-bloat-detective"
version = "0.1.0"
description = "Read-only Postgres bloat detective: cheap timeline + blocker attribution + index bloat + before/after proof"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.1"]
authors = [{name = "you"}]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["bloatdetective*"]

[project.scripts]
bloatdetective = "bloatdetective.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
