[project]
name = "pg-bloat-detective"
version = "0.1.3"
description = "PostgreSQL bloat checker: dead tuples, vacuum blockers (PID+query), index bloat via pgstatindex, REINDEX proof — read-only + MCP server"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["postgres", "postgresql", "bloat", "vacuum", "autovacuum", "dead-tuples", "pgstattuple", "pgstatindex", "reindex", "index-bloat", "unused-indexes", "backend-xmin", "idle-in-transaction", "dba", "monitoring", "prometheus", "grafana", "mcp", "mcp-server", "claude", "observability", "rds", "neon", "supabase"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
  "Topic :: System :: Monitoring",
]
dependencies = ["psycopg[binary]>=3.1", "mcp>=1.0,<2"]
authors = [{ name = "r69shabh" }]


[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["bloatdetective*"]

[project.scripts]
bloatdetective = "bloatdetective.__main__:main"
bloat-mcp = "bloatdetective.mcp_server:mcp.run"

[tool.pytest.ini_options]
testpaths = ["tests"]
