name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      pg:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bloatdemo
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BLOAT_DSN: dbname=bloatdemo user=postgres password=postgres host=localhost port=5433
      BLOAT_PY: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: Seed demo DB (extension + table the integration tests expect)
        run: |
          psql "$BLOAT_DSN" \
            -c "CREATE EXTENSION IF NOT EXISTS pgstattuple;" \
            -c "CREATE TABLE IF NOT EXISTS churn(id SERIAL PRIMARY KEY, v TEXT);" \
            -c "INSERT INTO churn(v) SELECT 'x' FROM generate_series(1,10000) ON CONFLICT DO NOTHING;"
      - name: Tests (unit + live integration)
        run: pytest -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: dashboard }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
